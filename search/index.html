<script>
    
    var pjax = new Pjax({
        selectors: [
            ".main-container",
            ".js-Pjax"
        ]
    });

    pjax._handleResponse = pjax.handleResponse;
    
    pjax.handleResponse = function(responseText, request, href, options) {
        if (request.responseText.match("<html")) {
            if (responseText) {
                let newDom = new DOMParser().parseFromString(responseText, 'text/html');
                let bodyClass = newDom.body.className;
                document.body.setAttribute("class", bodyClass);
            }
            pjax._handleResponse(responseText, request, href, options);
        } else {
            console.warn('Non-HTML response received');
        }
    };
    
    
    topbar.config({
        barColors: {
            '0': 'rgba(255, 255, 255, 1)',
            '1.0': 'rgba(0, 149, 234, 1)'
        }
    });
    
    
    window.commentManager = {
        isInitialized: false,
        currentInstance: null,
        
        
        destroy: function() {
            if (this.currentInstance && window.twikoo) {
                try {
                    
                    const container = document.getElementById('tcomment');
                    if (container) {
                        container.innerHTML = '';
                    }
                    
                    this.currentInstance = null;
                    this.isInitialized = false;
                    console.log('评论实例已销毁');
                } catch (error) {
                    console.error('销毁评论实例时出错:', error);
                }
            }
        },
        
        
        init: function() {
            const commentContainer = document.getElementById('tcomment');
            if (!commentContainer) {
                console.log('评论容器不存在，跳过评论初始化');
                return;
            }
            
            
            if (this.isInitialized) {
                this.destroy();
            }
            
            console.log('开始初始化评论...');
            
            
            if (window.twikoo && typeof window.twikoo.init === 'function') {
                this.initializeTwikoo();
                return;
            }
            
            
            this.loadTwikooScript();
        },
        
        
        loadTwikooScript: function() {
            
            const existingScript = document.querySelector('script[src*="twikoo"]');
            if (existingScript) {
                
                if (window.twikoo) {
                    this.initializeTwikoo();
                } else {
                    
                    existingScript.addEventListener('load', () => {
                        this.initializeTwikoo();
                    });
                }
                return;
            }
            
            
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/twikoo@1.6.39/dist/twikoo.all.min.js';
            script.async = true;
            
            script.onload = () => {
                console.log('Twikoo 脚本加载完成');
                this.initializeTwikoo();
            };
            
            script.onerror = () => {
                console.error('Twikoo 脚本加载失败');
            };
            
            document.head.appendChild(script);
        },
        
        
        initializeTwikoo: function() {
            if (!window.twikoo || typeof window.twikoo.init !== 'function') {
                console.error('Twikoo 未正确加载');
                return;
            }
            
            const commentContainer = document.getElementById('tcomment');
            if (!commentContainer) {
                console.log('评论容器不存在，跳过 Twikoo 初始化');
                return;
            }
            
            console.log('开始 Twikoo 初始化...');
            
            
            commentContainer.innerHTML = '';
            
            window.twikoo.init({
                envId: 'https://twikoo.congyu.dpdns.org',
                el: '#tcomment',
                lang: 'zh-CN'
            }).then(() => {
                console.log('Twikoo 评论初始化成功');
                this.isInitialized = true;
                this.currentInstance = window.twikoo;
            }).catch((err) => {
                console.error('Twikoo 评论初始化失败: ', err);
                this.isInitialized = false;
                this.currentInstance = null;
            });
        }
    };
    
    
    document.addEventListener('pjax:send', () => {
        
        topbar.show();
        
        window.commentManager.destroy();
    });
    
    document.addEventListener('pjax:complete', () => {
        
        if (window.Stack && typeof window.Stack.init === 'function') {
            window.Stack.init();
        }
        
        
        topbar.hide();
        
        
        setTimeout(() => {
            window.commentManager.init();
        }, 500);
    });
    
    
    document.addEventListener('DOMContentLoaded', function() {
        
        if (window.Stack && typeof window.Stack.init === 'function') {
            window.Stack.init();
        }
        
        
        setTimeout(() => {
            window.commentManager.init();
        }, 800);
    });
    
    
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            setTimeout(() => {
                const commentContainer = document.getElementById('tcomment');
                if (commentContainer && !window.commentManager.isInitialized) {
                    window.commentManager.init();
                }
            }, 300);
        }
    });
</script>

<script>
    async function renderKaTeX() {
        
        let katex = document.querySelector(".math-katex");
        if (!katex) {
            return;
        }
        
        while (typeof renderMathInElement !== 'function') {
            await delay(500);
        }        
        
        renderMathInElement(document.body, {
            delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\(", right: "\\)", display: false },
                { left: "\\[", right: "\\]", display: true }
            ],
            ignoredClasses: ["gist"]
        });
    }
    
    

    function delay(time) {
        return new Promise(resolve => {
            setTimeout(resolve, time)
        })
    }

    document.addEventListener('pjax:complete', () => {
        renderKaTeX();
    })
</script>

<script>
  function initCodeMoreBox() {
    let codeBlocks = document.querySelectorAll(".highlight");
    if (!codeBlocks) {
      return;
    }
    codeBlocks.forEach(codeBlock => {
      
      if (codeBlock.scrollHeight <= codeBlock.clientHeight) {
        return;
      }
      
      
      let codeMoreBox = document.createElement('div');
      codeMoreBox.classList.add('code-more-box');
      
      let codeMoreBtn = document.createElement('span');
      codeMoreBtn.classList.add('code-more-btn');
      codeMoreBtn.addEventListener('click', () => {
        codeBlock.classList.add('code-show');
        codeMoreBox.style.display = 'none';
        
        window.dispatchEvent(new Event('resize'))
      })
      
      let img = document.createElement('img');
      img.classList.add('code-more-img');
      img.src = "https://hugo.congyu.dpdns.org/icons/codeMore.png"
      
      codeMoreBtn.appendChild(img);
      codeMoreBox.appendChild(codeMoreBtn);
      codeBlock.appendChild(codeMoreBox)
    })
  }
  
  initCodeMoreBox();
</script>

<script>
    function initTocHide() {
        
        let toc = document.querySelector(".widget--toc");
        if (!toc) {
            return;
        }
        
        window.addEventListener('scroll', function() {
            
            let openUl = document.querySelectorAll(".open");
            if (openUl.length > 0) {
              openUl.forEach((ul) => {
                ul.classList.remove("open")
              })
            }
            
            let currentLi = document.querySelector(".active-class");
            if (!currentLi) {
                return
            }
            
            if (currentLi.children.length > 1) {
                currentLi.children[1].classList.add("open")
            }
            
            let ul = currentLi.parentElement;
            do {
                ul.classList.add("open");
                ul = ul.parentElement.parentElement
            } while (ul !== undefined && (ul.localName === 'ul' || ul.localName === 'ol'))
        });
    }
    initTocHide()
</script>

    window.onbeforeunload = () => {
        
        const playInfo = {
            index: ap.list.index,
            currentTime: ap.audio.currentTime,
            paused: ap.paused
        };
        localStorage.setItem("playInfo", JSON.stringify(playInfo));
    };

    

    window.onload = () => {
        
        const playInfo = JSON.parse(localStorage.getItem("playInfo"));
        if (!playInfo) {
            return;
        }
        
        ap.list.switch(playInfo.index);
        
        setTimeout(() => {
            
            ap.seek(playInfo.currentTime);
            
            if (!playInfo.paused) {
                ap.play()
            }
        }, 500);
    };
</script>

<style>

        display: none;
        position: fixed;
        bottom: 30px;
        z-index: 99;

<script>
    

    function initScrollTop() {
        let rightSideBar = document.querySelector(".right-sidebar");
        if (!rightSideBar) {
            return;
        }
        
        let btn = document.createElement("div");
        btn.id = "backTopBtn";
        btn.onclick = backToTop
        rightSideBar.appendChild(btn)
        
        window.onscroll = function() {
            
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };
    }

    

    function backToTop(){
        window.scrollTo({ top: 0, behavior: "smooth" })
    }

    initScrollTop();
</script>

<script>
  const cdnPath = "https://cdn.jsdelivr.net/gh/letere-gzj/live2d-widget-v3@main";
  const cdn2Path = "https://cdn.jsdelivr.net/gh/xiaocongyu66/hugo-resource-moc@main"
  const resPath = "/waifu"
  
  const config = {
    
    path: {
      homePath: "/",
      modelPath: cdn2Path + "/liv2d/moc3/",
      cssPath: cdn2Path + "/waifu.css",
      tipsJsonPath: cdnPath + "/waifu-tips.json",
      tipsJsPath: cdn2Path + "/waifu-tips.js",
      live2dCorePath: cdnPath + "/Core/live2dcubismcore.js",
      live2dSdkPath: cdnPath + "/live2d-sdk.js"
    },
    
    tools: ["hitokoto", "express", "switch-model", "switch-texture", "photo", "info", "quit"],
    
    drag: {
      enable: true,
      direction: ["x", "y"]
    },
    
    switchType: "order"
  }

  
  if (screen.width >= 768) {
    Promise.all([
      loadExternalResource(config.path.cssPath, "css"),
      loadExternalResource(config.path.live2dCorePath, "js"),
      loadExternalResource(config.path.live2dSdkPath, "js"),
      loadExternalResource(config.path.tipsJsPath, "js")
    ]).then(() => {
      initWidget({
        waifuPath: config.path.tipsJsonPath,
        cdnPath: config.path.modelPath,
        tools: config.tools,
        dragEnable: config.drag.enable,
        dragDirection: config.drag.direction,
        switchType: config.switchType
      });
    });
  }

  
  function loadExternalResource(url, type) {
    return new Promise((resolve, reject) => {
      let tag;
      if (type === "css") {
        tag = document.createElement("link");
        tag.rel = "stylesheet";
        tag.href = url;
      }
      else if (type === "js") {
        tag = document.createElement("script");
        tag.src = url;
      }
      if (tag) {
        tag.onload = () => resolve(url);
        tag.onerror = () => reject(url);
        document.head.appendChild(tag);
      }
    });
  }
</script>
